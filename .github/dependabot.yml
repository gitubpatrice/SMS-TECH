# v1.3.2 — Dependabot : alertes + PR automatiques sur les vulnérabilités des
# dépendances et sur les versions obsolètes. Le seul fait d'avoir ce fichier
# active les Dependabot version-update PRs (la partie "alertes de sécurité"
# nécessite en plus le toggle "Dependabot alerts" dans Settings → Code security
# du repo — geste manuel one-shot).

version: 2

updates:
  # Gradle dependencies (libs.versions.toml + build.gradle.kts)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    # Group minor + patch bumps into a single PR per ecosystem to reduce noise.
    # Major bumps stay individual (breaking changes need careful review).
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "androidx.compose*"
          - "androidx.activity*"
        update-types:
          - "minor"
          - "patch"
      androidx-core:
        patterns:
          - "androidx.core*"
          - "androidx.lifecycle*"
          - "androidx.work*"
          - "androidx.room*"
        update-types:
          - "minor"
          - "patch"
      tests:
        patterns:
          - "org.junit*"
          - "*truth*"
          - "*mockito*"
          - "*mockk*"
          - "*robolectric*"
        update-types:
          - "minor"
          - "patch"
    # Mesure du 2026-09-08 : ces trois familles exigent toutes AGP >= 9.0 (et
    # compileSdk 37), alors que le projet est en AGP 8.13.2. Le plafond est deja
    # documente dans gradle/libs.versions.toml. Sans ces regles, Dependabot
    # reproposait chaque semaine des PR condamnees a echouer — #12, #13 et #14
    # ont ainsi vecu des mois en rouge sans que personne ne les regarde.
    # A RETIRER le jour de la migration AGP 9 : ces regles la masqueraient.
    ignore:
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.19"]
      - dependency-name: "androidx.lifecycle:*"
        versions: [">= 2.11"]
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">= 2.4"]
      - dependency-name: "com.google.dagger:*"
        versions: [">= 2.59"]
      # Nom releve sur la PR #14 elle-meme (trailer updated-dependencies), pas devine.
      - dependency-name: "gradle-wrapper"
        versions: [">= 9"]
      # Mesure du 2026-09-14 sur les PR #28, #31 et #32, noms releves dans leurs trailers :
      # AGP 9.4 exige Gradle 9.6 ; Compose 1.12 (BOM 2026.09) et SQLCipher 4.19 exigent
      # compileSdk 37 ; les plugins Kotlin 2.4 butent sur le mur Hilt mesure le 2026-09-08
      # (la regle `org.jetbrains.kotlin:*` ci-dessus ne couvre pas les identifiants de
      # plugin, qui n'ont pas de deux-points). Meme sort : a retirer avec la migration AGP 9.
      - dependency-name: "com.android.application"
        versions: [">= 9"]
      - dependency-name: "com.android.library"
        versions: [">= 9"]
      - dependency-name: "com.android.test"
        versions: [">= 9"]
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">= 2.4"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.09.00"]
      - dependency-name: "net.zetetic:sqlcipher-android"
        versions: [">= 4.19"]
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"

  # GitHub Actions used in .github/workflows/*.yml (codeql, android, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
