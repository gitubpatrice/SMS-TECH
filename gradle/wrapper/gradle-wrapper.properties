distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.1-bin.zip
# Empreinte officielle publiee par Gradle (gradle-9.9.1-bin.zip.sha256), identique a celle du
# journal de transparence de F-Droid (gitlab.com/fdroid/gradle-transparency-log, checksums.json),
# sans quoi la build F-Droid echoue. Le wrapper refuse de demarrer si la distribution telechargee
# n'y correspond pas : c'est le dernier maillon de la chaine de build qui n'etait pas verifie,
# dans un projet dont l'APK publie est reconstruit par F-Droid.
# 9.9.1 et non 9.8.2 : 9.7.1 etait visee par six avis GHSA, dont trois (un critique) corriges
# seulement en 9.9.1 (catalogue de versions execute comme du code, registre du daemon).
distributionSha256Sum=d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
