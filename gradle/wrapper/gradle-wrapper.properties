distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# Empreinte officielle publiee par Gradle (gradle-9.7.1-bin.zip.sha256), identique a celle
# qu'Agenda Tech verifie depuis sa propre migration. Le wrapper refuse de demarrer si la
# distribution telechargee n'y correspond pas : c'est le dernier maillon de la chaine de build
# qui n'etait pas verifie, dans un projet dont l'APK publie est reconstruit par F-Droid.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
