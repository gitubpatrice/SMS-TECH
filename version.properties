# 295 = la v1.28.6 : deux retours d'utilisateurs, mesures sur S9 avant et apres.
#       (1) L'ECRAN DE BIENVENUE RESTAIT BLOQUE apres « Reinitialiser tous les reglages » ou
#       « Supprimer toutes mes donnees ». Les deux remettent `splashShown` a false, le splash se
#       rejoue en overlay, mais son garde d'idempotence — un AtomicBoolean qui vit aussi
#       longtemps que l'activite — etait reste arme depuis la premiere sortie : tap, retour et
#       auto-fermeture ne faisaient plus rien, seule la mort du processus liberait l'ecran.
#       Rearme a chaque passage false -> true. Test Compose instrumente, controle negatif fait.
#       (2) SELECTION LIBRE D'UN EXTRAIT DE MESSAGE. L'appui long copiait le message ENTIER
#       (doublon du « Copier » du menu) et rien ne permettait d'en copier une partie. L'appui
#       long ouvre desormais une boite de selection, aussi accessible par le menu. Hors de la
#       liste, et non dans la bulle : la selection par glissement se bat avec le defilement, le
#       tap-pour-reessayer et les liens. La copie du menu systeme passe par `LocalClipboard`,
#       enveloppe pour porter la marque « sensible » (N4) comme la copie totale ; sans elle, un
#       extrait du coffre ressortait en vignette d'apercu sous Android 13+. Mesure : un
#       `verticalScroll` SUR le conteneur de selection rend les poignees saccadees — aucun
#       defilement sous 480 caracteres, sur un parent au-dela.
#       (3) « SUPPRIMER TOUTES MES DONNEES » EN SESSION LEURRE n'efface plus que ce que le
#       leurre montre (conversations hors coffre par l'effaceur ordinaire, fichiers transitoires,
#       reglages hors bloc securite). Avant : coffre reel, PIN et code panique detruits en trois
#       tapes depuis le leurre. Trouve par audit de motif, trois tests, controle negatif.
#       (4) « SUPPRIMER TOUTES MES DONNEES » POUVAIT BLOQUER L'APPLICATION DEFINITIVEMENT.
#       Signale par Patrice et reproduit sur S24/Android 16 sur la 1.28.5 DEJA PUBLIEE : la purge
#       detruit la base, le fichier de cle enrobee et les alias du Keystore, mais le processus
#       SURVIT en gardant la passphrase SQLCipher en memoire (DatabaseFactory documente pourquoi
#       on ne peut pas l'effacer). La moindre reouverture de Room — jusqu'au vidage a la mort du
#       processus — recrivait un smstech.db chiffre avec une cle dont l'enrobage n'existait plus.
#       Au lancement suivant : ecran « ne parvient pas a ouvrir sa base de donnees », pour
#       toujours, et seule une reinstallation ramenait l'application. Mesure fichier par fichier
#       (base et sidecars reapparus a la mort du processus, cle absente).
#       Deux couches : le processus REDEMARRE apres la purge (supprime la classe entiere, et la
