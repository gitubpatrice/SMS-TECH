# Source unique de vérité de la version publiée.
#
# versionCode DOIT être strictement croissant : Android refuse d'installer un APK dont le
# versionCode est inférieur à celui déjà installé — l'utilisateur voit juste un échec incompréhensible.
#
# Il était auparavant dérivé de `git rev-list --count HEAD`. Deux défauts mesurés le 2026-08-08 :
#   - un rebase, un squash ou une greffe d'historique le fait BAISSER, ce qui casse la mise à jour
#     de toutes les installations existantes ;
#   - un build hors dépôt git (archive source, tarball F-Droid) retombait SILENCIEUSEMENT à 1.
#     Vérifié : `git archive` + `assembleRelease` produisait versionCode=1 sans un mot.
#
# Le figer ici le rend explicite, reproductible et indépendant de l'historique. C'est aussi ce qui
# permet à F-Droid de lire la version par regex (`UpdateCheckData`) au lieu d'y renoncer.
#
# À bumper À LA MAIN à chaque release (et seulement là), avant de builder l'APK.
# Le fichier nomme la DERNIÈRE VERSION PUBLIÉE, pas la prochaine : il se bumpe au moment de la
# release, jamais avant. Un `main` qui annonce une version inexistante est un piège pour quiconque
# construit depuis les sources.
# 280 = la v1.27.4 publiée (release GitHub du 08/08/2026) — dernier versionCode issu du compte de commits.
# 281 = la v1.27.5 : retrait du plugin foojay-resolver de settings.gradle.kts, ce qui rend le
#       build REPRODUCTIBLE, et retrait du bloc « Dependency metadata » que AGP destinait a la
#       console Play. Aucun changement fonctionnel. Meme traitement qu'Agenda Tech v1.0.2/1.0.3,
#       ou la mesure a montre que la seule presence de foojay changeait classes.dex.
# 282 = la v1.27.6 : `keepDebugSymbols` sur libdatastore_shared_counter.so. La verification
#       F-Droid de la 1.27.5 echouait sur ces SEULS fichiers — classes.dex etait identique.
#       AGP les strip avec l'outil du NDK, et leur buildserver n'a pas le meme NDK. En gardant
#       les symboles, le .so est recopie tel quel depuis l'AAR. Aucun changement fonctionnel.
# 283 = la v1.27.7 : metadonnees F-Droid uniquement. La description fastlane etait ecrite en
#       Markdown (soulignements Setext) que leur controle rend en <h1>, il manquait l'icone de
#       store, et surtout la description annoncait encore une traduction par Google ML Kit —
#       retire depuis la v1.7.0 — ainsi qu'une connexion aux serveurs Google que l'app ne fait
#       plus. L'ecran « A propos » de l'app, lui, disait deja juste. Ajoute aussi
#       `vcsInfo { include = false }`. Aucun changement fonctionnel.
# 284 = la v1.27.8 : le bouton flottant « Ajouter un numero » de l'ecran des numeros bloques
#       etait MUET pour un lecteur d'ecran. material3 1.4.0 enveloppe le slot `text` de
#       ExtendedFloatingActionButton dans un clearAndSetSemantics : le libelle est dessine mais
#       absent de l'arbre fusionne. Mesure sur le S9 : NAF="true" sur ce noeud. Nom accessible
#       pose sur le BOUTON.
# 285 = la v1.27.9 : la SAISIE des champs de recherche etait cassee. Leur `value` revenait par
#       StateFlow via collectAsStateWithLifecycle — et, sur la liste des conversations, APRES le
#       debounce de 200 ms — donc le champ se faisait reappliquer une valeur perimee ET la
#       position de curseur qui va avec. Mesure au clavier sur le S9 en 1.27.8 : « christine »
#       donnait `hrrrttttc`, et trois appuis sur « effacer » retiraient des lettres au MILIEU du
#       mot. Le texte saisi vit desormais en etat Compose, lu directement par le champ ; les flux
#       de filtrage en derivent par snapshotFlow. Le debounce est conserve, pour le filtrage seul.
# 286 = la v1.27.10 : correctifs issus de la relecture externe d'Andrew Pozdnakov sur la MR
#       F-Droid !38458 (2026-09-07), reproduits et verifies un par un avant correction.
#       Le PIN du coffre pouvait etre REMPLACE ou RETIRE sans qu'on demande jamais celui en
#       place : le porteur du seul PIN d'application ouvrait donc le coffre en deux tapes dans
#       les Reglages. Ce n'etait pas un oubli mais la porte de sortie documentee pour un PIN
#       oublie — sauf qu'une porte de sortie qui n'exige rien de plus que le facteur dont on se
#       protege EST le contournement. Les deux operations exigent desormais le PIN du coffre,
#       sous une temporisation exponentielle dediee (constat 3, absente jusqu'ici) ; la sortie
#       « PIN oublie » subsiste mais VIDE le coffre. Trois autres defauts fermes : le service
#       « mode resistant » etait declare `dataSync`, type qu'Android 15 borne a 6 h et interdit
#       de demarrer depuis BOOT_COMPLETED — il ne reprenait donc pas apres un redemarrage, en
#       silence, et mourait toutes les 6 h ; « repondre par message » depuis un appel entrant
#       n'a JAMAIS fonctionne (le manifeste declarait l'action depuis la v1.2.0, le code ne
#       l'acceptait pas) ; les liens « Code source » et « Confidentialite » de l'ecran A propos
#       rendaient 404 (`sms_tech` au lieu de `SMS-TECH`).
# 287 = la v1.27.11 : suite de la relecture d'Andrew Pozdnakov sur la MR !38458, qui a suivi les
#       chemins VOISINS de ceux fermes en 1.27.10 et en a trouve trois. Le PIN etait bien exige
#       pour etre remplace ou retire — mais « Reinitialiser tous les reglages » ecrivait
#       `AppSettings()` nu, dont les defauts sont `lockMode = OFF` et `vaultPinEnabled = false`.
#       Les empreintes des deux PIN vivant dans le magasin securise et non dans les reglages,
#       elles survivaient : plus personne ne les consultait, et le coffre restait plein.
#       Le bouton etant hors du garde `!isPanicDecoy`, une session leurre en sortait en trois
#       tapes, donnees intactes. La reinitialisation preserve desormais le bloc securite.
#       Deuxieme : la sortie « PIN oublie » retirait le PIN quel que soit le sort de la purge, y
#       compris quand celle-ci n'avait rien efface — deux etages avalaient l'echec en silence.
#       Elle exige desormais un coffre demontrablement vide. Troisieme : la restauration
#       recopiait `telephonyUri`, `mmsSystemId` et `subId` du telephone SOURCE, si bien qu'un
#       `content://sms/42` etranger entrait en collision sur l'index UNIQUE — le message
#       restaure etait ecarte en silence — puis repartait tel quel au fournisseur du systeme a
#       la suppression. La sauvegarde porte desormais l'empreinte de son appareil d'origine.
#
#       Trouve EN MESURANT sur appareil, et non prevu : `resolver.insert` rend
#       `content://sms/sent/<id>` sous Android 10, forme que le fournisseur REFUSE en
#       suppression, alors que c'est celle que SMS Tech enregistrait. La suppression systeme des
#       messages ecrits par l'application echouait donc DEPUIS TOUJOURS, l'exception etant
#       avalee. Sous Android 16 le meme appel rend deja la forme canonique.
#
#       La MEME divergence produisait un second defaut, reproduit avant d'etre corrige : l'import
#       construit la forme canonique, l'application enregistrait celle avec dossier, et l'index
#       UNIQUE compare des CHAINES. Les deux ecritures designant la meme ligne systeme ne se
#       rencontraient donc jamais, et une resynchronisation complete reimportait chaque message
#       ecrit par l'application EN DOUBLE. La regle de normalisation est desormais unique
#       (`canonicalTelephonyUri`) et appliquee aux trois endroits : a l'ecriture, pour qu'aucune
#       ligne divergente n'apparaisse ; a la suppression, pour les bases non encore migrees ; et
#       en base, par la migration 7 -> 8, qui normalise l'existant et efface les doublons deja
#       crees en conservant LA LIGNE DE L'APPLICATION — elle seule porte la reaction, la
#       citation, le favori, et surtout la conversation d'origine, qui peut etre le coffre.
#       Migration de DONNEES : le schema 8 a un identityHash identique au 7, verifie.
# 288 = la v1.27.12 : deux defauts d'interface, tous deux constates a l'ecran et non a la lecture.
#       (1) Dans un `Row`, Compose mesure les enfants SANS poids EN PREMIER : le bouton
#       « Definir par defaut » prenait toute sa largeur intrinseque et le texte, pourtant en
#       `weight(1f)`, heritait des miettes. Sur un Redmi 9C (360 dp de large) avec `font_scale`
#       a 1,33, le message s'affichait sur une colonne de sept caracteres, coupant un mot en
#       deux. Corrige aux DEUX endroits qui portaient le motif : le bandeau de la liste et la
#       rangee « App SMS par defaut » des Reglages, dont le `trailingContent` ecrasait le
#       `supportingContent` de la meme facon. Empilement plutot qu'un seuil de largeur a
#       deviner — c'est ce que prescrit Material des qu'un bandeau depasse une ligne.
#       (2) Rapporte par un testeur : le premier glissement apres un retour vers la liste etait
#       ignore. Le `NavHost` ne declarait aucune transition, il heritait donc du fondu par
#       defaut, et l'ecran qui REVIENT n'accepte pas les gestes tant qu'elle court. Seul le
#       `popEnter` est touche. Attenuation assumee et documentee comme telle : `NavHost`
#       n'expose rien pour rendre l'ecran entrant interactif, on RACCOURCIT la fenetre a 80 ms,
#       sous le seuil du perceptible. Mesure avant/apres par signature de la hierarchie
#       d'accessibilite sur un S9 force aux dimensions du Redmi.
# 289 = la v1.28.0 : palier MINEUR et non un treizieme correctif, parce que la sauvegarde
#       chiffree passe d'IMPOSSIBLE a fonctionnelle et qu'un chemin de securite change de
#       comportement visible.
#       (1) LA SAUVEGARDE CHIFFREE ETAIT IMPOSSIBLE DEPUIS LA v1.27.2 pour tout coffre non
#       vide. La garde exigeait une session coffre ouverte ; or cette session n'est ouverte que
#       par l'ecran du coffre et `lockedOnBack` la referme a chaque sortie, inconditionnellement.
#       L'ecran de sauvegarde n'etant atteignable qu'apres avoir quitte le coffre, aucun chemin
#       de navigation ne satisfaisait la condition. La question posee etait mauvaise : « la
#       session est-elle ouverte ? » devient « y a-t-il un second facteur, et l'a-t-on prouve ? ».
#       `VaultSecondFactorPolicy` porte cette reponse en un seul endroit ; l'ecran demande le PIN
#       du coffre SUR PLACE et emprunte la session le temps de l'ecriture, la refermant dans un
#       `finally`. Les utilisateurs SANS second facteur, bloques eux aussi alors que rien ne
#       protegeait leur coffre, ne le sont plus.
#       (2) FUITE DU MODE LEURRE : `A propos -> Aide` donnait le mode d'emploi complet du coffre
#       et du mode urgence. Le meme ecran filtrait deja sa liste « Fonctionnalites » depuis
#       l'audit C4 de la v1.26.1 ; sa liste « Aide », vingt lignes plus bas, ne l'etait pas.
#       (3) Deux defauts d'affichage : dans un `Row`, Compose mesure les enfants SANS poids en
#       premier, donc le bouton « Definir par defaut » ecrasait son propre texte sur ecran
#       etroit a police agrandie. Corrige aux deux endroits qui portaient le motif.
#       (4) Le premier glissement apres un retour vers la liste etait ignore : le `NavHost` ne
#       declarait aucune transition et l'ecran qui revient n'accepte pas les gestes tant qu'elle
#       court. Attenuation assumee a 80 ms, la bibliotheque n'exposant rien de mieux.
#       (5) 42 chaines orphelines retirees, 4 gardees a dessein (fonctionnalites non ecrites).
# 290 = la v1.28.1 : troisieme passe de la relecture d'Andrew Pozdnakov sur la MR !38458, plus
#       deux defauts trouves en cherchant autour des siens.
#       (1) LA PORTE « PIN DU COFFRE OUBLIE » S'OUVRAIT AU SECOND ESSAI. La v1.27.11 avait rendu
#       la purge honnete — elle disait ce qui avait echoue — sans la rendre REPRENABLE : la ligne
#       Room partait meme quand la copie systeme resistait. Au premier essai le PIN etait donc
#       correctement conserve, mais la conversation etait deja effacee ; au second, `idsInVault()`
#       rendait une liste vide, `VaultPurgeResult` valait 0/0/0 et `isComplete` etait vrai PAR
#       VACUITE. Le PIN partait, la copie systeme survivait, et la resynchronisation suivante la
#       ressuscitait EN CLAIR — l'etat exact que la v1.27.11 pretendait empecher. La ligne du
#       coffre est desormais conservee : elle EST le journal de purge, elle survit au redemarrage
#       parce qu'elle est en base, et la suppression systeme est retentee.
#       (2) LA MIGRATION 7 -> 8 SUPPRIMAIT SANS PREUVE. Elle tenait une collision d'URI pour un
#       doublon, sans comparer un seul champ. Or la restauration d'avant la v1.27.10 recopiait les
#       `telephony_uri` du telephone SOURCE : `content://sms/42` peut designer un message d'ici et
#       un autre venu d'ailleurs. La suppression exige desormais l'egalite de l'adresse, du corps,
#       de la date, du sens, du type ET de la conversation ; ce qui ne se prouve pas n'est plus
#       touche du tout.
#       (3) L'IDENTITE D'UNE LIGNE SYSTEME NE TENAIT QU'A LA DATE, a une minute pres — c'est-a-dire
#       a rien, une minute etant la duree ordinaire d'un echange. On compare desormais date, corps,
#       sens et adresse cote `content://sms` ; une identite invérifiable echoue du cote sur au lieu
#       de declencher la suppression.
#
#       TROUVE EN MESURANT, ET SIGNALE PAR PERSONNE : cote `content://mms`, la table designee par
#       l'URI ne porte ni corps ni adresse — ils vivent dans `part` et `addr` — si bien que
#       l'identite se reduisait a date + sens. Deux MMS recus a moins d'une minute d'intervalle
#       etaient indiscernables, et le test ecrit pour le verifier a SUPPRIME le MMS d'un autre
#       correspondant sur un Galaxy S9 avant que le correctif n'existe. L'adresse est desormais
#       relue dans `content://mms/<id>/addr`, par la regle de l'import et non une seconde ecriture
#       de la meme chose.
#
#       SECOND DEFAUT TROUVE EN AUDIT DE COHERENCE : l'effacement automatique de l'historique ne
#       propageait PAS au fournisseur du systeme, contrairement aux trois autres chemins de
#       suppression, et rien ne le documentait. Les messages que l'utilisateur croyait effaces
#       restaient dans `content://sms`, lisibles par toute application ayant READ_SMS, et le bouton
#       « Resynchroniser » les ramenait tous — alors que le dialogue promettait deja « Cette action
#       est irreversible ». La recette etait de surcroit ECRITE DEUX FOIS, le cycle mensuel de
#       `TelephonySyncWorker` la reecrivant a l'identique : la corriger d'un seul cote aurait
#       laisse la purge automatique, celle qui tourne sans que personne ne regarde, avec le defaut.
#
#       Le chemin destructeur a quitte `ConversationRepositoryImpl`, ou il vivait en `private` au
#       milieu de onze dependances : c'est parce qu'il n'etait pas testable que trois defauts y
#       sont passes en trois versions. 90 tests instrumentes, controle negatif effectue sur chaque
#       correctif — les defauts remis en place font tomber les tests qui les visent.
# 291 = la v1.28.2 : UN GARDE QUI REFUSE TOUJOURS DE LA MEME FACON N'EST PLUS UNE PROTECTION.
#       La v1.28.1 a eu raison de conserver la conversation du coffre quand sa copie systeme
#       resiste — c'est ce qui rend la purge REPRENABLE, et c'est ce qui a ferme la fuite du
#       second essai. Mais l'echec n'est pas toujours passager. Une sauvegarde restauree d'avant
#       la v1.27.10 recopiait les `telephony_uri` du telephone SOURCE : un message peut donc
#       porter DURABLEMENT une liaison qui, ici, designe un autre message. Le garde d'identite
#       refuse alors a chaque essai, a l'identique, et l'utilisateur qui a oublie son PIN de
#       coffre n'a plus aucune issue. Une porte de sortie qui ne s'ouvre jamais n'en est pas une :
#       le garde finissait par proteger l'application contre son proprietaire.
#
#       AU SECOND ECHEC SEULEMENT, l'application propose desormais de vider le coffre et de
#       retirer le PIN quand meme, apres avoir dit ce qui RESTERA sur le telephone — et le redit
#       une fois l'operation faite. Le premier echec continue d'inviter a reessayer : une panne
#       passagere (role SMS momentanement perdu) se leve d'elle-meme, et offrir tout de suite
#       l'option degradee pousserait a detruire plus que necessaire. Le drapeau qui distingue les
#       deux echecs est EN BASE (`vaultPurgeFailedOnce`) et non en memoire, sinon fermer
#       l'application entre deux essais ramenerait l'impasse.
#
#       CE N'EST PAS UN ASSOUPLISSEMENT DU GARDE. La copie systeme n'est toujours pas supprimee
#       sans preuve d'identite : `SystemCopyEraser` ne bouge pas d'une ligne. Ce qui change est
#       l'arbitrage LOCAL — conserver ou non la ligne Room quand la propagation a echoue — et il
#       appartient a l'utilisateur, informe, au second echec seulement.
#
#       Aucun autre changement fonctionnel. 92 tests instrumentes (91 OK, 1 ignore a raison),
#       controle negatif effectue : les deux regressions remises en place font tomber les tests
#       qui les visent.
versionCode=292
versionName=1.28.3
